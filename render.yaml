services:
  - type: web
    name: campus-events
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start -w api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: MCP_API_KEY
        sync: false
      - key: AMQP_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: Campus Events
      - key: EVENT_TIME_ZONE
        value: Europe/Budapest
